# Store screenshots in the five languages, on an Android 15 phone emulator.
# Manual only (Actions > Store screenshots > Run workflow). The result is one
# artifact, "store-screenshots", laid out like the repository: copy its
# fastlane/ folder over the one in the repository.
name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Language (one, to try changes to the script cheaply; all = the five)"
        type: choice
        default: all
        options: [all, en-US, it-IT, fr-FR, de-DE, es-ES]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(inputs.locale == 'all' && '["en-US","it-IT","fr-FR","de-DE","es-ES"]' || format('["{0}"]', inputs.locale)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache: the default "enhanced" one is proprietary since v6
          cache-provider: basic
          # The parallel jobs would all try to save the same entry: only build.yml writes it
          cache-read-only: true

      # Debug build: the debug diary is off (DebugLog.ENABLED), the screens are the same
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          # google_apis images allow a root shell (clock and language)
          target: google_apis
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 1200
          # The action's defaults, plus the language
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale ${{ matrix.locale }}
          script: scripts/store-screenshots.sh ${{ matrix.locale }}

      # Flat colors: lossy palette compression is invisible and saves about 70%
      - name: Compress
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends pngquant
          # Exit codes 98/99: file left as it is (no gain, or quality below 85)
          find screenshots/fastlane -name '*.png' -print0 | while IFS= read -r -d '' f; do
            pngquant --force --skip-if-larger --strip --quality 85-100 --ext .png "$f" || true
          done
          du -ah screenshots/fastlane

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: store-screenshots-${{ matrix.locale }}
          path: screenshots/
          if-no-files-found: ignore

  merge:
    needs: screenshots
    # Also when a language failed: the others are still useful
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-screenshots
          pattern: store-screenshots-*
          delete-merged: true
