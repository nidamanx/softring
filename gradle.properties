org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=false
kotlin.code.style=official
android.nonTransitiveRClass=true
# The app uses no AndroidX libraries at all (zero runtime dependencies).
android.useAndroidX=false
# R8 on one thread: with several, some optimizations (the narrowing of parameter types)
# may decide differently from one build to the next, and the release APK would not be
# reproducible (F-Droid builds it again and compares). Experimental in AGP: a warning.
android.r8.threadPoolSize=1
