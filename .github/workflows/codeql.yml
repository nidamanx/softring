# Code scanning with CodeQL (advanced setup).
# The default setup cannot read Kotlin: it analyzes without building ("none" mode,
# Java only). Here the app is built as in the Build workflow, so the Kotlin
# extractor sees every file. Runs only on the public repository: CodeQL is not
# available for private repositories on the free plan.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'nidamanx/softring'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.language == 'java-kotlin'
        with:
          # MIT-licensed cache: the default "enhanced" one is proprietary since v6
          cache-provider: basic
          # Only build.yml writes the cache
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        # --rerun-tasks: every Kotlin file must really be compiled for CodeQL to see it
        run: ./gradlew --no-daemon --rerun-tasks assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
