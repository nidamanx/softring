# Builds, signs and publishes a release.
# Two ways to start it:
#  - "Run workflow" in the Actions tab, on main only: releases the versionName
#    currently in app/build.gradle.kts and creates the tag v<versionName> itself.
#  - Pushing a tag v<versionName> (e.g. git push origin v1.0.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # create the tag and the release
  id-token: write      # sign the build provenance attestation
  attestations: write  # store the attestation
  artifact-metadata: write  # artifact storage record (attest v4)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          name="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)"
          tag="v$name"
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF_NAME != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts"
            exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Run the release from main, not from $GITHUB_REF"
            exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Increase versionName and versionCode first."
            exit 1
          fi
          # Same checks as the Build workflow, plus a released CHANGELOG section
          scripts/check-version.sh --release
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=$tag"
            echo "changelog=$changelog"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache: the default "enhanced" one is proprietary since v6
          cache-provider: basic
          # Release builds always start from a clean state
          cache-read-only: true

      - name: Decrypt signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z $KEYSTORE_BASE64 || -z $KEYSTORE_PASSWORD ]]; then
            echo "::error::The KEYSTORE_BASE64 or KEYSTORE_PASSWORD secret is missing (docs/MAINTAINING.md)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                -out "$RUNNER_TEMP/softring.jks" -pass env:KEYSTORE_PASSWORD

      - name: Test, lint and build signed APK
        env:
          SOFTRING_KEYSTORE_FILE: ${{ runner.temp }}/softring.jks
          SOFTRING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon test lintRelease assembleRelease

      - name: Remove the plain key
        if: always()
        run: rm -f "$RUNNER_TEMP/softring.jks"

      - name: Check permissions
        run: scripts/check-permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Verify signature and prepare files
        id: files
        run: |
          apk="softring-${{ steps.version.outputs.name }}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"

          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "dist/$apk" | tee "$RUNNER_TEMP/certs.txt"

          # The APK must be signed with the key whose fingerprint is published
          signed="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -n 1)"
          expected="$(tr -d ':\n' < keystore/certificate-sha256.txt | tr 'A-F' 'a-f')"
          if [[ $signed != "$expected" ]]; then
            echo "::error::APK certificate ($signed) differs from keystore/certificate-sha256.txt ($expected)"
            exit 1
          fi

          (cd dist && sha256sum "$apk" > SHA256SUMS)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "cert=$signed" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.files.outputs.apk }}

      - name: Write release notes
        run: |
          apk="${{ steps.files.outputs.apk }}"
          {
            cat "${{ steps.version.outputs.changelog }}"
            echo
            echo "## Verify"
            echo
            echo "SHA-256 of \`$apk\`:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Signing certificate SHA-256:"
            echo
            echo '```'
            echo "${{ steps.files.outputs.cert }}"
            echo '```'
            echo
            echo "Build provenance:"
            echo
            echo '```'
            echo "gh attestation verify $apk --repo $GITHUB_REPOSITORY"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Release created by hand from the web UI: attach files and notes
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "SoftRing ${{ steps.version.outputs.name }}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
